<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#1c2333" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- 4x4 grid world; brighter cells hold higher values, closer to the exit -->
  <g transform="translate(250 75)" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" text-anchor="middle">
    <g stroke="#30363d" stroke-width="2">
      <rect x="0"   y="0"   width="75" height="75" fill="#7dd3fc" fill-opacity="0.06" />
      <rect x="75"  y="0"   width="75" height="75" fill="#7dd3fc" fill-opacity="0.10" />
      <rect x="150" y="0"   width="75" height="75" fill="#7dd3fc" fill-opacity="0.14" />
      <rect x="225" y="0"   width="75" height="75" fill="#7dd3fc" fill-opacity="0.19" />
      <rect x="0"   y="75"  width="75" height="75" fill="#7dd3fc" fill-opacity="0.10" />
      <rect x="75"  y="75"  width="75" height="75" fill="#7dd3fc" fill-opacity="0.14" />
      <rect x="150" y="75"  width="75" height="75" fill="#7dd3fc" fill-opacity="0.19" />
      <rect x="225" y="75"  width="75" height="75" fill="#7dd3fc" fill-opacity="0.26" />
      <rect x="0"   y="150" width="75" height="75" fill="#7dd3fc" fill-opacity="0.14" />
      <rect x="75"  y="150" width="75" height="75" fill="#7dd3fc" fill-opacity="0.19" />
      <rect x="150" y="150" width="75" height="75" fill="#7dd3fc" fill-opacity="0.26" />
      <rect x="225" y="150" width="75" height="75" fill="#7dd3fc" fill-opacity="0.36" />
      <rect x="0"   y="225" width="75" height="75" fill="#7dd3fc" fill-opacity="0.19" />
      <rect x="75"  y="225" width="75" height="75" fill="#7dd3fc" fill-opacity="0.26" />
      <rect x="150" y="225" width="75" height="75" fill="#7dd3fc" fill-opacity="0.36" />
      <rect x="225" y="225" width="75" height="75" fill="#ff8a3d" fill-opacity="0.9" />
    </g>

    <!-- best-action arrows -->
    <g fill="#e6edf3" fill-opacity="0.85">
      <text x="37"  y="44">→</text><text x="112" y="44">→</text><text x="187" y="44">→</text><text x="262" y="44">↓</text>
      <text x="37"  y="119">↓</text><text x="112" y="119">→</text><text x="187" y="119">→</text><text x="262" y="119">↓</text>
      <text x="37"  y="194">→</text><text x="112" y="194">↓</text><text x="187" y="194">→</text><text x="262" y="194">↓</text>
      <text x="37"  y="269">→</text><text x="112" y="269">→</text><text x="187" y="269">→</text>
    </g>
    <text x="262" y="270" fill="#0d1117" font-weight="700" font-size="20">+10</text>

    <!-- robot start -->
    <circle cx="16" cy="16" r="7" fill="#c4b5fd" />
  </g>

  <text x="400" y="420" fill="#8b949e" font-family="IBM Plex Mono, monospace" font-size="18" text-anchor="middle">Q(s, a) ← Q(s, a) + α [ r + γ max Q(s′, a′) − Q(s, a) ]</text>
</svg>
