<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <rect width="1000" height="470" fill="#0d1117" />
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
    <!-- divider -->
    <line x1="500" y1="30" x2="500" y2="440" stroke="#30363d" stroke-width="2" stroke-dasharray="6 8" />

    <!-- BEFORE -->
    <text x="250" y="55" font-size="22" font-weight="700" fill="#8b949e" text-anchor="middle">Before: two things to find</text>
    <rect x="40" y="95" width="190" height="120" rx="18" fill="#161b22" stroke="#7dd3fc" stroke-width="2.5" />
    <text x="135" y="135" font-size="19" font-weight="700" fill="#7dd3fc" text-anchor="middle">MCP server</text>
    <text x="135" y="168" font-size="16" fill="#c9d1d9" text-anchor="middle">tools only</text>
    <text x="135" y="193" font-size="14" fill="#8b949e" text-anchor="middle">from a registry</text>

    <rect x="270" y="95" width="190" height="120" rx="18" fill="#161b22" stroke="#ff8a3d" stroke-width="2.5" stroke-dasharray="8 6" />
    <text x="365" y="135" font-size="19" font-weight="700" fill="#ff8a3d" text-anchor="middle">Skill folder</text>
    <text x="365" y="168" font-size="16" fill="#c9d1d9" text-anchor="middle">copied by hand</text>
    <text x="365" y="193" font-size="14" fill="#8b949e" text-anchor="middle">versioned separately</text>

    <path d="M135 225 L 230 330" stroke="#7dd3fc" stroke-width="3" fill="none" />
    <path d="M365 225 L 270 330" stroke="#ff8a3d" stroke-width="3" fill="none" stroke-dasharray="8 6" />
    <rect x="150" y="335" width="200" height="70" rx="18" fill="#161b22" stroke="#c4b5fd" stroke-width="2.5" />
    <text x="250" y="378" font-size="19" font-weight="700" fill="#c4b5fd" text-anchor="middle">Agent host</text>
    <text x="250" y="435" font-size="15" fill="#8b949e" text-anchor="middle">Nothing tells you the skill exists, or that it's stale.</text>

    <!-- AFTER -->
    <text x="750" y="55" font-size="22" font-weight="700" fill="#f0f6fc" text-anchor="middle">After: one connection</text>
    <rect x="590" y="85" width="320" height="200" rx="20" fill="#161b22" stroke="#7dd3fc" stroke-width="2.5" />
    <text x="750" y="120" font-size="19" font-weight="700" fill="#7dd3fc" text-anchor="middle">MCP server</text>
    <rect x="615" y="138" width="270" height="40" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2" />
    <text x="750" y="164" font-size="16" fill="#c9d1d9" text-anchor="middle">tools</text>
    <rect x="615" y="190" width="270" height="78" rx="10" fill="#0d1117" stroke="#ff8a3d" stroke-width="2.5" />
    <text x="750" y="218" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#ff8a3d" text-anchor="middle">skill://code-review/SKILL.md</text>
    <text x="750" y="246" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">…/references/checklist.md</text>

    <path d="M750 290 L 750 328" stroke="#ff8a3d" stroke-width="3.5" fill="none" />
    <path d="M740 318 L 750 332 L 760 318" stroke="#ff8a3d" stroke-width="3.5" fill="none" stroke-linejoin="round" />
    <rect x="650" y="335" width="200" height="70" rx="18" fill="#161b22" stroke="#c4b5fd" stroke-width="2.5" />
    <text x="750" y="378" font-size="19" font-weight="700" fill="#c4b5fd" text-anchor="middle">Agent host</text>
    <text x="750" y="435" font-size="15" fill="#8b949e" text-anchor="middle">The skill ships, and updates, with the tools it describes.</text>
  </g>
</svg>
